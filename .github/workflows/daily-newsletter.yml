name: Daily AI Agent Newsletter

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch secrets from Infisical
        if: ${{ secrets.INFISICAL_CLIENT_ID != '' && secrets.INFISICAL_CLIENT_SECRET != '' }}
        uses: Infisical/secrets-action@v1.0.13
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "agentcasex-3-qi-f"
          env-slug: "prod"
          export-type: "env"

      - name: Send daily 5 use cases digest
        env:
          RESEND_API_KEY: ${{ env.RESEND_API_KEY || secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ env.RESEND_AUDIENCE_ID || secrets.RESEND_AUDIENCE_ID }}
          RESEND_FROM: ${{ env.RESEND_FROM || secrets.RESEND_FROM }}
          UNSUBSCRIBE_SECRET: ${{ env.UNSUBSCRIBE_SECRET || secrets.UNSUBSCRIBE_SECRET }}
          SITE_URL: https://agentcases-ai.vercel.app
        run: node scripts/send-daily-digest.mjs
